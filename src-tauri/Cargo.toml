[package]
name = "app"
version = "0.1.0"
description = "EchoMind — local-first meeting transcription and minutes-of-meeting app for Windows."
license = "MIT"
edition = "2021"
# The crate has extra binaries (pipeline_cli, bench_cli), so a bare `cargo run`
# — which is what `tauri dev` issues — needs to be told which one is the app.
default-run = "app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
hound = "3.5"
rusqlite = { version = "0.40.2", features = ["bundled"] }
# Model-install integrity checking only (models_manager.rs). Not an AI runtime
# dependency and not a network dependency — downloads shell out to Windows'
# bundled curl.exe.
sha2 = "0.10"


# The release profile the §29 processing-time budget assumes. `tauri dev`'s
# debug build only orchestrates: the heavy work happens inside whisper.cpp /
# sherpa-onnx / llama.cpp, which are release binaries either way.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
